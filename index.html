<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMSENG TRANSLATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Global and Background Styles */
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background-color: #0A192F; /* Deep Navy Blue */
            min-height: 100vh;
            color: #CCD6F6; /* Light Grey Text */
            padding: 2rem;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* Container Card - Simple, flat, and professional */
        .flat-card {
            background-color: #112240; /* Slightly lighter Navy */
            border-radius: 0.5rem;
            box-shadow: 0 10px 30px rgba(2, 12, 27, 0.8);
            border: 1px solid #233554;
        }

        /* Header Logo/Title */
        .header-title {
            font-family: 'Space Mono', monospace;
            color: #64FFDA; /* Aqua Green */
            font-weight: 700;
        }

        /* Input and Select Styles */
        .text-input, .select-input {
            background: #112240;
            border: 1px solid #233554;
            border-radius: 0.25rem;
            padding: 0.75rem;
            color: #CCD6F6;
            font-family: 'Space Mono', monospace;
            transition: 0.2s;
        }
        .text-input:focus, .select-input:focus {
            border-color: #64FFDA;
            outline: none;
            box-shadow: 0 0 5px #64FFDA20;
        }
        .select-input option {
            background-color: #0A192F;
            color: #CCD6F6;
        }

        /* Output Box Styles */
        .output-box {
            background: #0A192F;
            border: 1px solid #64FFDA;
            border-radius: 0.25rem;
            padding: 1rem;
            min-height: 100px;
            color: #CCD6F6;
            line-height: 1.5;
            font-size: 1rem;
            white-space: pre-wrap;
            font-family: 'Space Mono', monospace;
            box-shadow: inset 0 0 5px rgba(100, 255, 218, 0.1);
        }

        /* Button Styles (Aqua Green) */
        .btn-primary {
            background-color: #64FFDA;
            color: #0A192F;
            transition: all 0.2s ease;
            font-weight: 700;
        }
        .btn-primary:hover {
            background-color: #4bdaa8;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(100, 255, 218, 0.3);
        }
        .btn-primary:disabled {
            background-color: #3e5350;
            cursor: not-allowed;
            color: #A8B2D1;
            transform: none;
            box-shadow: none;
        }

        /* Secondary Button (Image/Submit) */
        .btn-secondary {
            background-color: #233554; /* Darker blue */
            color: #64FFDA;
            transition: all 0.2s ease;
            border: 1px solid #64FFDA;
        }
        .btn-secondary:hover {
            background-color: #586E73;
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.4);
        }


        /* Clear Button (Red/Pink) */
        .btn-clear {
            background-color: #E63946;	
            color: #fff;
            transition: all 0.2s ease;
        }
        .btn-clear:hover {
            background-color: #d12e3c;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }

        /* Image Drop Zone Styles */
        #image-drop-zone {
            border: 2px dashed #64FFDA;
            background: #0A192F;
            border-radius: 0.5rem;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        #image-drop-zone.active {
            background: #112240;
            box-shadow: 0 0 10px #64FFDA;
        }

        #image-preview {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-radius: 0.3rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #64FFDA;
        }

        #upload-text {
            padding: 1rem;
            background: rgba(10, 25, 47, 0.7);
            border-radius: 0.3rem;
            color: #F2843F;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }
        /* Utility for hiding/showing elements smoothly */
        .hidden-initial {
            display: none;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-4xl flat-card p-6 md:p-10">

        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl header-title">
                <span class="text-white">GMSENG</span> TRANSLATOR
            </h1>
            <p class="text-sm mt-2" style="color: #8892B0;">// Text & Image Translator \\</p>
        </header>

        <main>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-white mb-2">অনুবাদ মোড নির্বাচন করুন:</label>
                <select id="language-select" class="w-full select-input cursor-pointer">
                    <option value="ko-bn">কোরিয়ান থেকে বাংলা (Ko ➡ Bn)</option>
                    <option value="bn-ko">বাংলা থেকে কোরিয়ান (Bn ➡ Ko)</option>
                </select>
            </div>

            <div class="mb-6 border-b border-gray-700 pb-6">
                <label id="input-label" class="block text-lg font-bold header-title mb-2">ইনপুট মোড: কোরিয়ান টেক্সট</label>

                <textarea id="input-text" rows="3" class="w-full text-input resize-none mb-4" placeholder="কোরিয়ান টেক্সট লিখুন..."></textarea>
                
                <button id="toggle-image-btn" class="btn-secondary py-2 px-6 rounded-sm text-sm flex items-center justify-center gap-2 mb-4">
                    🖼️ IMAGE TO TEXT
                </button>

                <div id="image-input-container" class="hidden-initial">
                    <h3 class="text-base font-semibold text-white mb-2 flex items-center gap-2">
                        ১. Image upload/paste:
                    </h3>
                    
                    <div id="image-drop-zone" class="mb-4">
                        <input type="file" id="image-file-upload" accept="image/png, image/jpeg, image/webp" class="hidden">
                        <img id="image-preview" src="" alt="Image Preview" class="hidden">
                        <div id="upload-text">
                            **Import Image or Paste Image** <p class="text-xs mt-1" style="color: #64FFDA;">Ko ➡ Bn মোডে OCR সমর্থিত।</p>
                        </div>
                    </div>
                    
                    <button id="image-submit-btn" class="btn-secondary py-2 px-6 rounded-sm text-sm w-full mb-4">
                        🔍 Submit OCR
                    </button>
                    <hr style="border-color: #F2843F;" class="mb-4">
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 justify-center mb-8">
                <button id="translate-btn" class="btn-primary py-3 px-8 rounded-sm text-lg flex items-center justify-center gap-2">
                    <span>🌐</span> অনুবাদ করুন
                </button>
                <button id="clear-btn" class="btn-clear py-3 px-8 rounded-sm text-lg flex items-center justify-center gap-2">
                    <span>🗑️</span> মুছে ফেলুন
                </button>
                
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h2 id="translation-title" class="text-lg font-semibold text-white mb-2">অনুবাদ:</h2>
                    <div id="translation-output" class="output-box flex items-center justify-center text-gray-400 italic">
                        অনুবাদ এখানে দেখাবে...
                    </div>
                </div>
                <div>
                    <h2 id="pronunciation-title" class="text-lg font-semibold text-white mb-2">উচ্চারণ:</h2>
                    <div id="pronunciation-output" class="output-box flex items-center justify-center text-gray-400 italic">
                        উচ্চারণ এখানে দেখাবে...
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center mt-10 text-xs" style="color: #8892B0;">
            &copy; 2025 GMSENG Corporation. Designed by HEMEL(***JY245***).
        </footer>

    </div>

    <script>
        // --- Configuration (OpenAI) ---
        // REPLACE WITH YOUR ACTUAL OPENAI API KEY
        const API_KEY = "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"; 
        const API_URL = `https://api.openai.com/v1/chat/completions`;
        const OPENAI_MODEL = "gpt-4.1-mini"; // Multi-modal model for best translation and OCR

        let uploadedImageFile = null; // Stores the image File object

        // --- DOM Elements ---
        const languageSelect = document.getElementById('language-select');
        const inputText = document.getElementById('input-text');
        const inputLabel = document.getElementById('input-label');
        const imageDropZone = document.getElementById('image-drop-zone');
        const imagePreview = document.getElementById('image-preview');
        const uploadText = document.getElementById('upload-text');
        const imageFileUpload = document.getElementById('image-file-upload');
        const translateBtn = document.getElementById('translate-btn');
        const clearBtn = document.getElementById('clear-btn');
        const toggleImageBtn = document.getElementById('toggle-image-btn');
        const imageInputContainer = document.getElementById('image-input-container');
        const imageSubmitBtn = document.getElementById('image-submit-btn');
        const translationOutput = document.getElementById('translation-output');
        const pronunciationOutput = document.getElementById('pronunciation-output');
        const translationTitle = document.getElementById('translation-title');
        const pronunciationTitle = document.getElementById('pronunciation-title');

        // --- Helper Function: Convert File to Base64 URI (For OpenAI) ---
        function fileToDataUrl(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    resolve(reader.result); // Returns data:image/jpeg;base64,...
                };
                reader.readAsDataURL(file);
            });
        }

        // --- Image Handling Logic ---
        function handleImageFile(file) {
            if (file && file.type.startsWith('image/')) {
                uploadedImageFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    uploadText.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                alert("দয়া করে একটি বৈধ ইমেজ ফাইল (.png, .jpg, .webp) আপলোড করুন।");
                clearImage();
            }
        }

        function clearImage() {
            uploadedImageFile = null;
            imageFileUpload.value = '';
            imagePreview.src = '';
            imagePreview.classList.add('hidden');
            uploadText.classList.remove('hidden');
            imageDropZone.classList.remove('active');
        }

        // --- Toggle Image Input Visibility ---
        toggleImageBtn.addEventListener('click', () => {
            imageInputContainer.classList.toggle('hidden-initial');
            if (imageInputContainer.classList.contains('hidden-initial')) {
                toggleImageBtn.innerHTML = '🖼️ IMAGE TO TEXT';
                clearImage();
            } else {
                toggleImageBtn.innerHTML = '❌ Close Input Image';
            }
        });

        // Paste Event Listener
        document.addEventListener('paste', (e) => {
            if (imageInputContainer.classList.contains('hidden-initial')) return; // Ignore paste if hidden
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    const imageBlob = items[i].getAsFile();
                    if (imageBlob) {
                        e.preventDefault();
                        handleImageFile(imageBlob);
                        break;
                    }
                }
            }
        });

        // Click/Drag Event Listeners
        imageDropZone.addEventListener('click', () => {
            if (!imageInputContainer.classList.contains('hidden-initial')) {
                imageFileUpload.click();
            }
        });
        imageFileUpload.addEventListener('change', (e) => {
            handleImageFile(e.target.files[0]);
        });
        imageDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!imageInputContainer.classList.contains('hidden-initial')) {
                imageDropZone.classList.add('active');
            }
        });
        imageDropZone.addEventListener('dragleave', () => {
            imageDropZone.classList.remove('active');
        });
        imageDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            imageDropZone.classList.remove('active');
            if (!imageInputContainer.classList.contains('hidden-initial')) {
                const file = e.dataTransfer.files[0];
                handleImageFile(file);
            }
        });


        // --- State Management ---
        languageSelect.addEventListener('change', () => {
            const mode = languageSelect.value;
            clearFields();
            if (mode === 'ko-bn') {
                inputLabel.innerText = "ইনপুট মোড: কোরিয়ান টেক্সট";
                inputText.placeholder = "কোরিয়ান টেক্সট লিখুন...";
                translationTitle.innerText = "অনুবাদ (বাংলা/English):";
                pronunciationTitle.innerText = "উচ্চারণ (বাংলা):";
            } else {
                inputLabel.innerText = "ইনপুট মোড: বাংলা টেক্সট";
                inputText.placeholder = "বাংলা টেক্সট লিখুন...";
                translationTitle.innerText = "অনুবাদ (কোরিয়ান):";
                pronunciationTitle.innerText = "উচ্চারণ (বাংলা):";
            }
        });
        languageSelect.dispatchEvent(new Event('change')); // Initial setup

        clearBtn.addEventListener('click', clearFields);

        function clearFields() {
            translationOutput.classList.add('fade-out');
            pronunciationOutput.classList.add('fade-out');

            setTimeout(() => {
                inputText.value = '';
                clearImage(); // Clear image state
                
                translationOutput.innerText = 'অনুবাদ এখানে দেখাবে...';
                translationOutput.classList.add('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
                translationOutput.classList.remove('text-white', 'text-left', 'block');

                pronunciationOutput.innerText = 'উচ্চারণ এখানে দেখাবে...';
                pronunciationOutput.classList.add('text-gray-400', 'italic', 'flex', 'items-center', 'justify-content');
                pronunciationOutput.classList.remove('text-white', 'text-left', 'block');
                
                translationOutput.classList.remove('fade-out');
                pronunciationOutput.classList.remove('fade-out');
            }, 300);
        }

        // --- Image OCR to Text Input (OpenAI Vision) ---
        imageSubmitBtn.addEventListener('click', async () => {
            const mode = languageSelect.value;
            if (mode === 'bn-ko') {
                alert("ইমেজ OCR শুধুমাত্র 'কোরিয়ান থেকে বাংলা' (Ko ➡ Bn) মোডে কাজ করবে।");
                return;
            }
            if (!uploadedImageFile) {
                alert("দয়া করে ইমেজ আপলোড করুন অথবা পেস্ট করুন।");
                return;
            }

            // Temporarily disable buttons
            imageSubmitBtn.disabled = true;
            translateBtn.disabled = true;
            imageSubmitBtn.innerHTML = `<span class="animate-spin">⏳</span> টেক্সট এক্সট্র্যাক্ট হচ্ছে...`;
            inputText.value = "Convert Image to Text, অপেক্ষা করুন...";
            
            translationOutput.innerText = "ইমেজ থেকে টেক্সট ইনপুট বক্সে দেওয়া হলে আপনি অনুবাদ করতে পারবেন।";
            pronunciationOutput.innerText = "---";

            try {
                const dataUrl = await fileToDataUrl(uploadedImageFile);
                
                const textPrompt = `Extract all Korean and English text from this image and provide only the Raw Text (without any explanation, translation, or formatting), suitable for use in an input box. Give only the extracted text.`;

                const payload = {
                    model: OPENAI_MODEL,
                    messages: [{
                        role: "user",
                        content: [
                            { type: "text", text: textPrompt },
                            { type: "image_url", image_url: { url: dataUrl } }
                        ]
                    }],
                    max_tokens: 1000,
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}` // OpenAI Key
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error (${response.status}): ${errorData.error.message}`);
                }

                const data = await response.json();
                const extractedText = data.choices[0].message.content.trim();

                if (extractedText) {
                    inputText.value = extractedText;
                    translationOutput.innerText = "টেক্সট ইনপুট বক্সে দেওয়া হয়েছে। এখন অনুবাদ বাটনে ক্লিক করুন।";
                } else {
                    inputText.value = "ইমেজ থেকে কোনো টেক্সট পাওয়া যায়নি।";
                }

            } catch (error) {
                console.error(error);
                inputText.value = `❌ টেক্সট বের করার সময় সমস্যা হয়েছে: ${error.message}`;
            } finally {
                imageSubmitBtn.disabled = false;
                translateBtn.disabled = false;
                imageSubmitBtn.innerHTML = `🔍 Submit OCR`;
                // Hide the image container after submission for a cleaner view
                imageInputContainer.classList.add('hidden-initial');
                toggleImageBtn.innerHTML = '🖼️ IMAGE TO TEXT';
                clearImage();
            }
        });


        // --- Main Translation Logic (OpenAI) ---
        translateBtn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            const mode = languageSelect.value;
            

            if (!text) {
                alert("দয়া করে অনুবাদ করার জন্য টেক্সট ইনপুট বক্সে কিছু লিখুন!");
                return;
            }

            if (API_KEY === "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" || !API_KEY) {
                alert("অনুগ্রহ করে কোডের মধ্যে আপনার OpenAI API Key পরিবর্তন করুন।");
                return;
            }

            translateBtn.disabled = true;
            translateBtn.innerHTML = `<span class="animate-spin">⏳</span> অপেক্ষা করুন...`;
            translationOutput.innerText = "অনুবাদ হচ্ছে...";
            pronunciationOutput.innerText = "তৈরি হচ্ছে...";
            
            translationOutput.classList.remove('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
            pronunciationOutput.classList.remove('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
            
            translationOutput.classList.add('text-white', 'text-left', 'block');
            pronunciationOutput.classList.add('text-white', 'text-left', 'block');

            let systemInstructions = "";
            let userPrompt = `Input Text: "${text}"`; 

            // --- 1. Define Instructions for ko-bn ---
            if (mode === 'ko-bn') {
                systemInstructions = `
                Role: Professional Korean to Bengali translator.
                TASK: Use the Input Text, then apply the RULES/REPLACEMENTS and provide the translation and pronunciation.
                
                RULES:
                1. Translate Korean to Bengali (mixed with English if needed).
                2. Provide Bengali Pronunciation of the Korean text.
                
                REPLACEMENTS:
                - 열처리 전후 -> JON/HOO
                - 열처리 전 -> JON
                - 열처리 후 -> HOO
                - 상형 -> UPR
                - 하형 -> LWR
                - 표시 -> মার্ক
                - 비교 -> বিগু
                - 일 -> তারিখ
                - 추가 -> ছূগা
                - 시 -> টা
                - 재료 -> zero
                - 영역 -> BOUNDARY
                - 윤곽 -> ইয়ংগাক
                - 올렸습니다 -> আপলোড করেছি
                - 형상 -> হ্যিয়ংসাং
                - 가공 -> কাজ করা
                - 후 -> পর
                - 참고 -> ছামগু
                - 보정 -> বোজং
                - 셋팅도 -> সেটিংদো
                - 탄다 -> কাটা
                - 이어서 -> একবারে
                - 면취 -> মিউঞ্ছি
                - 골부위 -> গুল্বুই
                - 무안 -> মুয়ান
                - 평등 -> পিয়ংদো
                - 음각 -> উমগাক
                - 열처리부 -> ইয়লছলিবু(=Trim Line)

                ALLOWED KOREAN WORDS:
                - 황삭, 중삭, 정삭
                
                ENGLISH RULES:
                - Keep Acronyms: UPR DIE, LWR DIE, OP30, NC, NCD, LR, RH, MIRROR, SHEET.
                - Hangul English (프로세스) -> English (Process).
                - Keep all other English words in English.
                
                OUTPUT FORMAT:
                Line 1: [Translated Text]
                Line 2: ///
                Line 3: [Bengali Pronunciation]
                `;

            } else { // --- 2. Define Instructions for bn-ko ---
                systemInstructions = `
                Role: Translate Bengali/English to Korean (Hangul).
                
                RULES:
                1. If the input text contains anything within double quotes ("..."), translate the surrounding text but keep that specific quoted text exactly as it is without translation.
                2. Provide Bengali Pronunciation of the Korean translation.
                
                REPLACEMENTS:
                - UPR -> 상형
                - LWR -> 하형
                - মার্ক -> 표시
                - বিগু -> 비교
                - তারিখ -> 일
                - ছূগা -> 추가
                - সেটিংদো -> 셋팅도
                - বোজং -> 보정
                - ইয়ংগাক -> 윤곽
                - JON -> 열처리 전
                - HOO -> 열처리 후
                - BOUNDARY -> 영역
                - স্যার -> 차장님
                - একবারে -> 이어서
                - অংশ -> 구간
                - মিউঞ্ছি -> 면취
                - গুল্বুই -> 골부위
                - মুয়ান -> 무안
                - পিয়ংদো -> 평등
                - টা (time) -> 시
                - zero -> 재료
                - উমগাক -> 음각
                
                ALLOWED KOREAN WORDS:
                - 황삭, 중삭, 정삭
                
                OUTPUT FORMAT:
                Line 1: [Korean Translation]
                Line 2: ///
                Line 3: [Bengali Pronunciation of Korean]
                `;
            }

            // --- 3. Final Prompt Structure for OpenAI ---
            const messages = [
                { role: "system", content: systemInstructions },
                { role: "user", content: userPrompt }
            ];

            try {
                const payload = {
                    model: OPENAI_MODEL,
                    messages: messages,
                    max_tokens: 1000,
                    temperature: 0.1, // Keep it low for consistent translation
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}` // OpenAI Key
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error (${response.status}): ${errorData.error.message || JSON.stringify(errorData)}`);
                }

                const data = await response.json();
                const resultText = data.choices[0].message.content.trim();

                const parts = resultText.split('///');
                const translation = parts[0] ? parts[0].trim() : "ত্রুটি: অনুবাদ পাওয়া যায়নি।";
                const pronunciation = parts[1] ? parts[1].trim() : "উচ্চারণ পাওয়া যায়নি।";

                translationOutput.innerText = translation;
                pronunciationOutput.innerText = pronunciation;

            } catch (error) {
                console.error(error);
                translationOutput.innerText = "❌ সমস্যা হয়েছে! (কন্ট্রোল দেখুন)";
                pronunciationOutput.innerText = "Details: " + error.message;
            } finally {
                translateBtn.disabled = false;
                translateBtn.innerHTML = `<span>🌐</span> অনুবাদ করুন`;
            }
        });
    </script>
</body>
</html>
