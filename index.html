<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMSENG TRANSLATOR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans Bengali', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 300% 300%;
      animation: bgMove 12s ease infinite;
      min-height: 100vh;
      color: #e2e8f0;
    }
    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      background-color: rgba(17, 25, 40, 0.75);
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .btn-translate {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      transition: all 0.3s ease;
    }
    .btn-translate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 114, 255, 0.4);
    }
    .btn-translate:disabled {
      background: #4b5563;
      cursor: not-allowed;
      transform: none;
    }

    .btn-clear {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      transition: all 0.3s ease;
    }
    .btn-clear:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 75, 43, 0.4);
    }

    .output-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      padding: 1.5rem;
      min-height: 120px;
      color: #f1f5f9;
      line-height: 1.6;
      font-size: 1.1rem;
      white-space: pre-wrap;
    }

    .text-input, .select-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.8rem;
      padding: 1rem;
      color: #fff;
      transition: 0.3s ease;
    }
    .text-input:focus, .select-input:focus {
      border-color: #00c6ff;
      outline: none;
      box-shadow: 0 0 10px rgba(0,198,255,0.3);
    }
    .select-input option {
      background-color: #1e293b;
      color: white;
    }
    
    .fade-out {
        opacity: 0;
        transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

  <div class="w-full max-w-4xl glass-card p-6 md:p-10">

    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">
        🌙 GMSENG TRANSLATOR
      </h1>
      <p class="text-gray-400 mt-2 text-sm md:text-base">Professional Korean ↔ Bangla Translator</p>
    </header>

    <main>
      <div class="mb-6">
        <label class="block text-sm font-semibold text-cyan-300 mb-2">অনুবাদ মোড নির্বাচন করুন:</label>
        <select id="language-select" class="w-full select-input cursor-pointer">
          <option value="ko-bn">কোরিয়ান থেকে বাংলা (Ko ➡ Bn)</option>
          <option value="bn-ko">বাংলা থেকে কোরিয়ান (Bn ➡ Ko)</option>
        </select>
      </div>

      <div class="mb-6">
        <label id="input-label" class="block text-sm font-semibold text-gray-300 mb-2">কোরিয়ান টেক্সট লিখুন:</label>
        <textarea id="input-text" rows="5" class="w-full text-input resize-none" placeholder="এখানে লিখুন..."></textarea>
      </div>

      <div class="flex flex-col md:flex-row gap-4 justify-center mb-8">
        <button id="translate-btn" class="btn-translate text-white font-bold py-3 px-8 rounded-full text-lg flex items-center justify-center gap-2">
          <span>🌐</span> অনুবাদ করুন
        </button>
        <button id="clear-btn" class="btn-clear text-white font-bold py-3 px-8 rounded-full text-lg flex items-center justify-center gap-2">
          <span>🗑️</span> মুছে ফেলুন
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h2 id="translation-title" class="text-lg font-semibold text-cyan-300 mb-2">অনুবাদ:</h2>
          <div id="translation-output" class="output-box flex items-center justify-center text-gray-400 italic">
            ফলাফল এখানে দেখাবে...
          </div>
        </div>
        <div>
          <h2 id="pronunciation-title" class="text-lg font-semibold text-pink-300 mb-2">উচ্চারণ:</h2>
          <div id="pronunciation-output" class="output-box flex items-center justify-center text-gray-400 italic">
            উচ্চারণ এখানে দেখাবে...
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center mt-10 text-gray-500 text-xs">
      &copy; 2025 GMSENG Corporation. Design by HEMEL(***JY243***).
    </footer>

  </div>

  <script>
    // --- Configuration ---
    const API_KEY = "AIzaSyBpDVnqk9ZR6Ex254ws8W9JipCH_kgLQJY";
    
    // --- MODEL SWITCHED TO gemini-2.5-flash (User Specified Working Model) ---
    // মডেল পরিবর্তন করা হয়েছে: gemini-2.5-flash
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

    // --- DOM Elements ---
    const languageSelect = document.getElementById('language-select');
    const inputText = document.getElementById('input-text');
    const inputLabel = document.getElementById('input-label');
    const translateBtn = document.getElementById('translate-btn');
    const clearBtn = document.getElementById('clear-btn');
    const translationOutput = document.getElementById('translation-output');
    const pronunciationOutput = document.getElementById('pronunciation-output');
    const translationTitle = document.getElementById('translation-title');
    const pronunciationTitle = document.getElementById('pronunciation-title');

    // --- State Management ---
    languageSelect.addEventListener('change', () => {
      const mode = languageSelect.value;
      clearFields();
      if (mode === 'ko-bn') {
        inputLabel.innerText = "কোরিয়ান টেক্সট লিখুন:";
        translationTitle.innerText = "অনুবাদ (বাংলা/English):";
        pronunciationTitle.innerText = "উচ্চারণ (বাংলা):";
      } else {
        inputLabel.innerText = "বাংলা টেক্সট লিখুন:";
        translationTitle.innerText = "অনুবাদ (কোরিয়ান):";
        pronunciationTitle.innerText = "উচ্চারণ (বাংলা):";
      }
    });

    clearBtn.addEventListener('click', clearFields);

    function clearFields() {
      translationOutput.classList.add('fade-out');
      pronunciationOutput.classList.add('fade-out');

      setTimeout(() => {
        inputText.value = '';
        translationOutput.innerText = 'ফলাফল এখানে দেখাবে...';
        translationOutput.classList.add('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
        translationOutput.classList.remove('text-white', 'text-left', 'block');

        pronunciationOutput.innerText = 'উচ্চারণ এখানে দেখাবে...';
        pronunciationOutput.classList.add('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
        pronunciationOutput.classList.remove('text-white', 'text-left', 'block');
        
        translationOutput.classList.remove('fade-out');
        pronunciationOutput.classList.remove('fade-out');
      }, 300);
    }

    // --- Main Translation Logic ---
    translateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      if (!text) {
        alert("দয়া করে কিছু লিখুন!");
        return;
      }

      translateBtn.disabled = true;
      translateBtn.innerHTML = `<span class="animate-spin">⏳</span> অপেক্ষা করুন...`;
      translationOutput.innerText = "অনুবাদ হচ্ছে...";
      pronunciationOutput.innerText = "তৈরি হচ্ছে...";
      
      translationOutput.classList.remove('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
      pronunciationOutput.classList.remove('text-gray-400', 'italic', 'flex', 'items-center', 'justify-center');
      
      translationOutput.classList.add('text-white', 'text-left', 'block');
      pronunciationOutput.classList.add('text-white', 'text-left', 'block');

      const mode = languageSelect.value;
      let systemInstructions = "";

      if (mode === 'ko-bn') {
        systemInstructions = `
        Role: Professional Korean to Bengali translator.
        
        RULES:
        1. Translate Korean to Bengali (mixed with English if needed).
        2. Provide Bengali Pronunciation of the Korean text.
        
        REPLACEMENTS:
        - 열처리 전후 -> JON/HOO
        - 열처리 전 -> JON
        - 열처리 후 -> HOO
        - 상형 -> UPR
        - 하형 -> LWR
        - 표시 -> মার্ক
        - 비교 -> বিগু
        - 일 -> তারিখ
        - 추가 -> ছূগা
        - 시 -> টা
        - 재료 -> zero
        - 영역 -> BOUNDARY
        - 윤곽 -> ইয়ংগাক
        - 올렸습니다 -> আপলোড করেছি
        - 형상 -> হ্যিয়ংসাং
        - 가공 -> কাজ করা
        - 후 -> পর
        - 참고 -> ছামগু
        - 보정 -> বোজং
        - 셋팅도 -> সেটিংদো
        - 탄다 -> কাটা
        - 이어서 -> একবারে
        - 면취 -> মিউঞ্ছি
        - 골부위 -> গুল্বুই
        - 무안 -> মুয়ান
        - 평등 -> পিয়ংদো
        - 음각 -> উমগাক
        - 열처리부 -> ইয়লছলিবু

        ALLOWED KOREAN WORDS:
        - 황삭, 중삭, 정삭, 잔삭, 전체
        
        ENGLISH RULES:
        - Keep Acronyms: UPR DIE, LWR DIE, OP30, NC, NCD, LR, RH, MIRROR, SHEET.
        - Hangul English (프로세스) -> English (Process).
        
        OUTPUT FORMAT:
        Line 1: [Translated Text]
        Line 2: ///
        Line 3: [Bengali Pronunciation]
        `;
      } else {
        systemInstructions = `
        Role: Translate Bengali/English to Korean (Hangul).
        RULES:
        1. If the input text contains anything within double quotes ("..."), keep that specific quoted text exactly as it is without translation.
        
        REPLACEMENTS:
        - UPR -> 상형
        - LWR -> 하형
        - মার্ক -> 표시
        - বিগু -> 비교
        - তারিখ -> 일
        - ছূগা -> 추가
        - সেটিংদো -> 셋팅도
        - বোজং -> 보정
        - ইয়ংগাক -> 윤곽
        - JON -> 열처리 전
        - HOO -> 열처리 후
        - BOUNDARY -> 영역
        - স্যার -> 차장님
        - একবারে -> 이어서
        - অংশ -> 구간
        - মিউঞ্ছি -> 면취
        - গুল্বুই -> 골부위
        - মুয়ান -> 무안
        - পিয়ংদো -> 평등
        - টা (time) -> 시
        - zero -> 재료
        - উমগাক -> 음각
        
        ALLOWED KOREAN WORDS:
        - 황삭, 중삭, 정삭
        
        OUTPUT FORMAT:
        Line 1: [Korean Translation]
        Line 2: ///
        Line 3: [Bengali Pronunciation of Korean]
        `;
      }

      // --- COMBINING PROMPT + USER INPUT (Universal Method) ---
      const finalPrompt = `${systemInstructions}\n\nInput to Translate: ${text}\n\nResponse:`;

      try {
        const payload = {
          contents: [{ 
            parts: [{ text: finalPrompt }] 
          }]
        };

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(`API Error (${response.status}): ${errorData.error.message}`);
        }

        const data = await response.json();
        const resultText = data.candidates[0].content.parts[0].text;

        const parts = resultText.split('///');
        const translation = parts[0] ? parts[0].trim() : "ত্রুটি: অনুবাদ পাওয়া যায়নি।";
        const pronunciation = parts[1] ? parts[1].trim() : "উচ্চারণ পাওয়া যায়নি।";

        translationOutput.innerText = translation;
        pronunciationOutput.innerText = pronunciation;

      } catch (error) {
        console.error(error);
        translationOutput.innerText = "❌ সমস্যা হয়েছে!";
        pronunciationOutput.innerText = "Details: " + error.message;
      } finally {
        translateBtn.disabled = false;
        translateBtn.innerHTML = `<span>🌐</span> অনুবাদ করুন`;
      }
    });
  </script>
</body>
</html>
